# Sample Logstash configuration for creating a simple
# Beats -> Logstash -> Elasticsearch pipeline.

input {
  jdbc { 
    jdbc_connection_string => "${LOGSTASH_JDBC_URL}"
    # The user we wish to execute our statement as
    jdbc_user => "${LOGSTASH_JDBC_USERNAME}"
    jdbc_password => "${LOGSTASH_JDBC_PASSWORD}"
    # The path to our downloaded jdbc driver
    jdbc_driver_library => "${LOGSTASH_JDBC_DRIVER_JAR_LOCATION}"
    jdbc_driver_class => "${LOGSTASH_JDBC_DRIVER}"
    # our query
    statement => "SELECT species.SpecCode, species.Genus, species.Species, species.FBname, families.Family, families.FamPic, species.PicPreferredName, GROUP_CONCAT(DISTINCT t_synonyms.Synonym) AS synonyms, GROUP_CONCAT(DISTINCT t_comnames.ComName) AS commonnames
FROM species LEFT JOIN families ON species.FamCode = families.FamCode

LEFT JOIN (
    SELECT `species`.`SpecCode`, CONCAT(`synonyms`.`SynGenus`, ' ', `synonyms`.`SynSpecies`) AS Synonym
    FROM synonyms LEFT JOIN species ON `synonyms`.`SpecCode` = `species`.`SpecCode` 
    WHERE (`synonyms`.`SynSpecies` NOT LIKE 'sp.%' AND `synonyms`.`Status` <> 'misapplied name' AND `synonyms`.taxonlevel NOT IN ('family','genus')) 
    ORDER BY `species`.`SpecCode`, Synonym
)
AS t_synonyms ON species.SpecCode = t_synonyms.SpecCode

LEFT JOIN (
    SELECT species.SpecCode, comnames.ComName
    FROM comnames LEFT JOIN species ON (comnames.SpecCode = species.SpecCode) 
    WHERE (comnames.Rank <>5)
    ORDER BY species.SpecCode, comnames.ComName
)
AS t_comnames ON species.SpecCode = t_comnames.SpecCode
GROUP BY species.SpecCode"
    }
  }
filter{
    mutate{
	split => {"commonnames" => ","}
	}
	}
filter {
     mutate {
       split => { "synonyms" => "," }
     }
   }
filter {
     mutate {
       add_field => { "ScientificName" => "%{genus} %{species}" }
     }
   }
filter {
     mutate {
       lowercase => [ "fampic" ]
     }
   }
filter {
     mutate {
       lowercase => [ "picpreferredname" ]
     }
   }




output {
  stdout { codec => json_lines }
  elasticsearch {
  hosts => ["${LOGSTASH_ELASTICSEARCH_HOST}"]
  index => ["fbsearch"]
  document_id => "%{[speccode]}"
  #"document_type" => "data"
  }
}
